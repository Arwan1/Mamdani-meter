[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nyc-civic-platform"
version = "0.1.0"
description = "Local-first platform services for the NYC Civic Priorities app"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "google-genai>=1.0,<2.0",
  "PyMuPDF>=1.24,<2.0",
  "rapidfuzz>=3.9,<4.0",
  "Pillow>=10.4,<12.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "hypothesis>=6.112,<7.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
nycp = "nyc_civic.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_civic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
